name: pre-review-pr

on:
  pull_request:
    types:
      - opened
      - review_requested
      - synchronize
  # Manually re-scan open PRs for any that meet the pre-commit.ci autoupdate criteria
  workflow_dispatch:
    inputs:
      force-review:
        description: Re-submit reviews for PRs that already have an approval
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find-prec-prs:
    # Only needed when manually dispatched; the pull_request event already has a single PR to act on
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr-numbers: ${{ steps.search.outputs.pr-numbers }}
    steps:
      - name: Search for open pre-commit.ci autoupdate PRs
        id: search
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_numbers=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --json number,title,author \
            --jq '[.[] | select(.title == "[pre-commit.ci] pre-commit autoupdate" and .author.is_bot)] | map(.number)')
          echo "pr-numbers=${pr_numbers}" >> "$GITHUB_OUTPUT"

  review-pre-commit-pr:
    needs: [find-prec-prs]
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest
    # Only run for pre-commit.ci autoupdate PRs or when ccbr-bot[bot] is requested as a reviewer
    if: >
      always() &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.title == '[pre-commit.ci] pre-commit autoupdate' &&
          (
            (github.event.action == 'opened' && github.event.sender.type == 'Bot') ||
            (github.event.action == 'review_requested' && github.event.requested_reviewer.login == 'ccbr-bot[bot]')
          )
        )
        || (github.event_name == 'workflow_dispatch' && needs.find-prec-prs.outputs.pr-numbers != '[]')
      )
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ github.event_name == 'workflow_dispatch' && fromJson(needs.find-prec-prs.outputs.pr-numbers) || fromJson(format('[{0}]', github.event.pull_request.number)) }}

    steps:
      - uses: actions/checkout@v7
      - name: Generate CCBR-bot token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CCBR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CCBR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: CCBR/actions/review-pre-commit-pr@v0.8.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          pr-number: ${{ matrix.pr-number }}
          repo: ${{ github.repository }}
          reviewer: CCBR/adminteam
          force-review: ${{ github.event.action == 'review_requested' || inputs.force-review || false }}

  find-post-release-prs:
    # Only needed when manually dispatched; the pull_request event already has a single PR to act on
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr-numbers: ${{ steps.search.outputs.pr-numbers }}
    steps:
      - name: Search for open post-release cleanup PRs
        id: search
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_numbers=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --json number,title,author \
            --jq '[.[] | select(.title | startswith("chore: post-release cleanup for")) | select(.author.is_bot)] | map(.number)')
          echo "pr-numbers=${pr_numbers}" >> "$GITHUB_OUTPUT"

  review-post-release-pr:
    needs: [find-post-release-prs]
    runs-on: ubuntu-latest
    container: nciccbr/ccbr_actions:latest
    # Only run for post-release cleanup PRs or when ccbr-bot[bot] is requested as a reviewer
    if: >
      always() &&
      (
        (
          github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.title, 'chore: post-release cleanup for') &&
          (
            ((github.event.action == 'opened' || github.event.action == 'synchronize') && github.event.sender.type == 'Bot') ||
            (github.event.action == 'review_requested' && github.event.requested_reviewer.login == 'ccbr-bot[bot]')
          )
        )
        || (github.event_name == 'workflow_dispatch' && needs.find-post-release-prs.outputs.pr-numbers != '[]')
      )
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ github.event_name == 'workflow_dispatch' && fromJson(needs.find-post-release-prs.outputs.pr-numbers) || fromJson(format('[{0}]', github.event.pull_request.number)) }}

    steps:
      - uses: actions/checkout@v7
      - name: Generate CCBR-bot token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CCBR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CCBR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: CCBR/actions/review-post-release-pr@main
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          pr-number: ${{ matrix.pr-number }}
          repo: ${{ github.repository }}
          force-review: ${{ github.event.action == 'review_requested' || inputs.force-review || false }}
